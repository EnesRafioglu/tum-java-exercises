# TODO
services:
  stable-app:
    build: .
    image: stable-app
    container_name: stable-app
    ports:
      - "8081:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=stable


  canary-app:
    build: .
    image: canary-app
    container_name: canary-app
    environment:
      - SPRING_PROFILES_ACTIVE=canary
    ports:
      - "8082:8080"

  nginx:
      image: nginx:latest
      container_name: nginx
      ports:
        - "80:80"
      volumes:
        - ./nginx.conf:/etc/nginx/nginx.conf:ro
      depends_on:
        - stable-app
        - canary-app
