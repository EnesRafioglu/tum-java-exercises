plugins {
    id 'org.springframework.boot' version '3.5.4'
    id "io.spring.dependency-management" version "1.1.7"
    id 'java'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

version = '1.0.0'
compileJava.options.encoding = 'UTF-8'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter:3.5.5'
    implementation 'org.springframework.boot:spring-boot-starter-web:3.5.5'
    testImplementation 'org.springframework.boot:spring-boot-starter-test:3.5.5'
}

sourceSets {
    main {
        java {
            srcDir 'src'
        }
        resources {
            srcDir 'src/resources'
        }
    }
    test {
        java {
            srcDirs = []
        }
    }
}
