services:
  blue-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blue-app
    environment:
      - SPRING_PROFILES_ACTIVE=blue
    ports:
      - "8081:8080"

  green-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: green-app
    environment:
      - SPRING_PROFILES_ACTIVE=green
    ports:
      - "8082:8080"

  # TODO 4.1: Define the green-app service in the docker-compose.yml file.
  # The green-app service should use the 'green' profile.
  # You may have a look at the blue-app service for reference.

  # TODO 4.2: Add the green-app service to the depends_on list of the nginx service.
  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - blue-app
      - green-app
